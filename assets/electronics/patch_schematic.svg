<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1130" viewBox="0 0 1500 1130"><rect width="100%" height="100%" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#102338}.title{font-size:28px;font-weight:bold}.small{font-size:14px}.label{font-size:17px}.box{fill:white;stroke:#315873;stroke-width:2}.wire{stroke:#11789a;stroke-width:3;fill:none}</style>
<text x="35" y="45" font-family="Arial,sans-serif" font-size="28" fill="#102338">ROBOSKIN | Patch circuit sheets and physical-pin map</text>
<text x="35" y="78" font-family="Arial,sans-serif" font-size="14" fill="#102338">All component pins and nets: electronics/patch_circuit.json and patch_circuit_connections.csv. Drawing shows the repeated circuit and buses.</text>
<rect x="35" y="110" width="415" height="185" rx="8" fill="white" stroke="#315873" stroke-width="2"/>
<text x="50" y="137" font-family="Arial,sans-serif" font-size="17" fill="#102338">Power: J1 pins 1/2 = 5V_PATCH/GND</text>
<text x="50" y="164" font-family="Arial,sans-serif" font-size="14" fill="#102338">U2 TPS2553DBVR-1:1 IN,2GND,3EN</text>
<text x="50" y="186" font-family="Arial,sans-serif" font-size="14" fill="#102338">4 FAULT_N,5ILIM=200k toGND,6OUT</text>
<text x="50" y="208" font-family="Arial,sans-serif" font-size="14" fill="#102338">U3 TPS7A2433:1IN,2/4GND,3EN=IN,5OUT</text>
<text x="50" y="230" font-family="Arial,sans-serif" font-size="14" fill="#102338">5V_NODE -&gt; 3V3 -&gt; 10ohm -&gt; 3V3_A</text>
<text x="50" y="252" font-family="Arial,sans-serif" font-size="14" fill="#102338">Local bypass capacitors as in netlist</text>
<text x="50" y="274" font-family="Arial,sans-serif" font-size="14" fill="#102338">J1 pins 3/4 = CANH/CANL (sensor bus)</text>
<rect x="495" y="110" width="450" height="185" rx="8" fill="white" stroke="#315873" stroke-width="2"/>
<text x="510" y="137" font-family="Arial,sans-serif" font-size="17" fill="#102338">U1 STM32G0B1CBT6, LQFP48</text>
<text x="510" y="164" font-family="Arial,sans-serif" font-size="14" fill="#102338">6 VDD/VDDA;7 VSS/VSSA;4VBAT=3V3</text>
<text x="510" y="186" font-family="Arial,sans-serif" font-size="14" fill="#102338">5 VREF+=3V3_A;10NRST=10k/100nF</text>
<text x="510" y="208" font-family="Arial,sans-serif" font-size="14" fill="#102338">8 PF0=8MHz oscillator;HSE bypass</text>
<text x="510" y="230" font-family="Arial,sans-serif" font-size="14" fill="#102338">44/45/46 = muxA0/A1/A2</text>
<text x="510" y="252" font-family="Arial,sans-serif" font-size="14" fill="#102338">22/25/26/27 = muxEN0/1/2/3</text>
<text x="510" y="274" font-family="Arial,sans-serif" font-size="14" fill="#102338">11/12/18/20 = ADC bank0/1/2/3</text>
<rect x="990" y="110" width="475" height="185" rx="8" fill="white" stroke="#315873" stroke-width="2"/>
<text x="1005" y="137" font-family="Arial,sans-serif" font-size="17" fill="#102338">U4 TCAN3413DR / CAN protection</text>
<text x="1005" y="164" font-family="Arial,sans-serif" font-size="14" fill="#102338">1TXD-&gt;MCU48;4RXD-&gt;MCU47</text>
<text x="1005" y="186" font-family="Arial,sans-serif" font-size="14" fill="#102338">2GND;3VCC/5VIO=3V3;8STB-&gt;MCU28</text>
<text x="1005" y="208" font-family="Arial,sans-serif" font-size="14" fill="#102338">6CANL-&gt;J1.4;7CANH-&gt;J1.3</text>
<text x="1005" y="230" font-family="Arial,sans-serif" font-size="14" fill="#102338">TXD10k andSTB47k pull-up to3V3</text>
<text x="1005" y="252" font-family="Arial,sans-serif" font-size="14" fill="#102338">PESD2CANFD24V-T at connector</text>
<text x="1005" y="274" font-family="Arial,sans-serif" font-size="14" fill="#102338">No patch termination; ends on permanent trunk</text>
<path d="M450,205 L495,205" stroke="#11789a" stroke-width="3" fill="none"/>
<path d="M945,205 L990,205" stroke="#11789a" stroke-width="3" fill="none"/>
<rect x="35" y="345" width="1430" height="260" rx="8" fill="white" stroke="#315873" stroke-width="2"/><text x="50" y="373" font-family="Arial,sans-serif" font-size="17" fill="#102338">One independent analog channel — repeat28 times; EOL is physically at the remote cell</text><text x="60" y="405" font-family="Arial,sans-serif" font-size="14" fill="#102338">3V3_A</text><path d="M80,420 L160,420" fill="none" stroke="#11789a" stroke-width="2"/><rect x="160" y="410" width="80" height="20" fill="white" stroke="#315873" stroke-width="2"/><text x="165" y="402" font-family="Arial,sans-serif" font-size="14" fill="#102338">R_BIAS 22k</text><path d="M240,420 L300,420" fill="none" stroke="#11789a" stroke-width="2"/><text x="280" y="405" font-family="Arial,sans-serif" font-size="14" fill="#102338">SNS_i</text><path d="M300,420 L470,420" fill="none" stroke="#11789a" stroke-width="2"/><rect x="470" y="410" width="80" height="20" fill="white" stroke="#315873" stroke-width="2"/><text x="475" y="402" font-family="Arial,sans-serif" font-size="14" fill="#102338">R_SER 1k</text><path d="M550,420 L700,420" fill="none" stroke="#11789a" stroke-width="2"/><text x="575" y="405" font-family="Arial,sans-serif" font-size="14" fill="#102338">SNS_FILT_i</text><rect x="700" y="398" width="145" height="50" fill="white" stroke="#315873" stroke-width="2"/><text x="705" y="390" font-family="Arial,sans-serif" font-size="14" fill="#102338">TMUX1308</text><text x="708" y="425" font-family="Arial,sans-serif" font-size="14" fill="#102338">Sx</text><text x="818" y="425" font-family="Arial,sans-serif" font-size="14" fill="#102338">D</text><path d="M845,420 L920,420" fill="none" stroke="#11789a" stroke-width="2"/><rect x="920" y="410" width="100" height="20" fill="white" stroke="#315873" stroke-width="2"/><text x="925" y="402" font-family="Arial,sans-serif" font-size="14" fill="#102338">R_MUX_OUT 4.7k</text><path d="M1020,420 L1260,420" fill="none" stroke="#11789a" stroke-width="2"/><text x="1250" y="405" font-family="Arial,sans-serif" font-size="14" fill="#102338">MCU ADC</text><path d="M300,420 L300,465" fill="none" stroke="#11789a" stroke-width="2"/><path d="M300,465 L400,465" fill="none" stroke="#11789a" stroke-width="2"/><path d="M300,465 L300,480" fill="none" stroke="#11789a" stroke-width="2"/><path d="M400,465 L400,480" fill="none" stroke="#11789a" stroke-width="2"/><rect x="285" y="480" width="30" height="45" fill="white" stroke="#315873" stroke-width="2"/><text x="290" y="472" font-family="Arial,sans-serif" font-size="14" fill="#102338">FSR</text><rect x="385" y="480" width="30" height="45" fill="white" stroke="#315873" stroke-width="2"/><text x="390" y="472" font-family="Arial,sans-serif" font-size="14" fill="#102338">EOL100k</text><path d="M300,525 L300,540" fill="none" stroke="#11789a" stroke-width="2"/><path d="M400,525 L400,540" fill="none" stroke="#11789a" stroke-width="2"/><path d="M300,540 L400,540" fill="none" stroke="#11789a" stroke-width="2"/><path d="M350,540 L350,548" fill="none" stroke="#11789a" stroke-width="2"/><path d="M338,548 L362,548" fill="none" stroke="#11789a" stroke-width="2"/><path d="M342,553 L358,553" fill="none" stroke="#11789a" stroke-width="2"/><path d="M347,558 L353,558" fill="none" stroke="#11789a" stroke-width="2"/><path d="M610,420 L610,435" fill="none" stroke="#11789a" stroke-width="2"/><path d="M598,435 L622,435" fill="none" stroke="#11789a" stroke-width="2"/><path d="M598,442 L622,442" fill="none" stroke="#11789a" stroke-width="2"/><path d="M610,442 L610,465" fill="none" stroke="#11789a" stroke-width="2"/><text x="630" y="442" font-family="Arial,sans-serif" font-size="14" fill="#102338">100pF</text><path d="M610,465 L610,473" fill="none" stroke="#11789a" stroke-width="2"/><path d="M598,473 L622,473" fill="none" stroke="#11789a" stroke-width="2"/><path d="M602,478 L618,478" fill="none" stroke="#11789a" stroke-width="2"/><path d="M607,483 L613,483" fill="none" stroke="#11789a" stroke-width="2"/><path d="M1140,420 L1140,435" fill="none" stroke="#11789a" stroke-width="2"/><path d="M1128,435 L1152,435" fill="none" stroke="#11789a" stroke-width="2"/><path d="M1128,442 L1152,442" fill="none" stroke="#11789a" stroke-width="2"/><path d="M1140,442 L1140,465" fill="none" stroke="#11789a" stroke-width="2"/><text x="1160" y="442" font-family="Arial,sans-serif" font-size="14" fill="#102338">100pF</text><path d="M1140,465 L1140,473" fill="none" stroke="#11789a" stroke-width="2"/><path d="M1128,473 L1152,473" fill="none" stroke="#11789a" stroke-width="2"/><path d="M1132,478 L1148,478" fill="none" stroke="#11789a" stroke-width="2"/><path d="M1137,483 L1143,483" fill="none" stroke="#11789a" stroke-width="2"/><text x="50" y="588" font-family="Arial,sans-serif" font-size="14" fill="#102338">SNS_i also connects to the entry ESD array. EOL and FSR are parallel; a continuous circuit does not prove an intact sensing coating.</text>
<rect x="35" y="650" width="685" height="205" rx="8" fill="white" stroke="#315873" stroke-width="2"/>
<text x="50" y="677" font-family="Arial,sans-serif" font-size="17" fill="#102338">Four TMUX1308 banks</text>
<text x="50" y="704" font-family="Arial,sans-serif" font-size="14" fill="#102338">Pins16VDD=3V3_A,8GND,3D output;7NC</text>
<text x="50" y="726" font-family="Arial,sans-serif" font-size="14" fill="#102338">Pins11/10/9=A0/A1/A2;6EN low selects,47k pull-up</text>
<text x="50" y="748" font-family="Arial,sans-serif" font-size="14" fill="#102338">S0..S7 pins:13,14,15,12,1,5,2,4</text>
<text x="50" y="770" font-family="Arial,sans-serif" font-size="14" fill="#102338">Bank0 cells0..6; bank1 7..13;bank2 14..20;bank3 21..27</text>
<text x="50" y="792" font-family="Arial,sans-serif" font-size="14" fill="#102338">S7 references: top/bottom30k/10k,15k/10k,10k/15k,10k/30k</text>
<text x="50" y="814" font-family="Arial,sans-serif" font-size="14" fill="#102338">250us settling peraddress; verify allchannels, not onlyreferences</text>
<rect x="765" y="650" width="700" height="205" rx="8" fill="white" stroke="#315873" stroke-width="2"/>
<text x="780" y="677" font-family="Arial,sans-serif" font-size="17" fill="#102338">Thermal / witness / service</text>
<text x="780" y="704" font-family="Arial,sans-serif" font-size="14" fill="#102338">TwoNCU18XH103F60RB10kNTCs on separate thermal flex</text>
<text x="780" y="726" font-family="Arial,sans-serif" font-size="14" fill="#102338">39k bias;1k inputseries;1nF ADCshunt;MCUpins23/24</text>
<text x="780" y="748" font-family="Arial,sans-serif" font-size="14" fill="#102338">PB2pin21 -&gt;1k -&gt;sheetloop -&gt;1k -&gt;PB4pin43 +100k pulldown</text>
<text x="780" y="770" font-family="Arial,sans-serif" font-size="14" fill="#102338">SWD:3V3sense/GND/PA13pin35/PA14pin36/NRST10</text>
<text x="780" y="792" font-family="Arial,sans-serif" font-size="14" fill="#102338">UART:PA2pin13 TX /PA3pin14 RX /GND;3.3V levels</text>
<text x="780" y="814" font-family="Arial,sans-serif" font-size="14" fill="#102338">Service strap PA10pin32,10kpull-up; ground before reset</text>
<rect x="35" y="900" width="1430" height="165" rx="8" fill="white" stroke="#315873" stroke-width="2"/>
<text x="50" y="927" font-family="Arial,sans-serif" font-size="17" fill="#102338">Sensor-tail connector J_SENSOR: Hirose FH12-40S-0.5SH(55)</text>
<text x="50" y="954" font-family="Arial,sans-serif" font-size="14" fill="#102338">Pins1..28=SNS0..27;29/30NC;31SENS_GND;32THERM_GND;33WIT_OUT;34WIT_IN;35..40GND.</text>
<text x="50" y="976" font-family="Arial,sans-serif" font-size="14" fill="#102338">Bottom-contact0.5mm pitch;0.3mm finished stiffened tail. Thermal signals use separate pads J_THERMAL.</text>
<text x="50" y="998" font-family="Arial,sans-serif" font-size="14" fill="#102338">100k printed EOL +/-20%;22k bias1%. Nominal unloaded3357 ADCcounts; open&gt;3900; overload/short&lt;30.</text>
<text x="50" y="1020" font-family="Arial,sans-serif" font-size="14" fill="#102338">Status: pin-level design, not a routed PCB. Hardware current, leakage, ESD, ADC timing and thermistor calibration remain measured release gates.</text>
</svg>
