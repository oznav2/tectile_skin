<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1030" viewBox="0 0 1500 1030"><rect width="100%" height="100%" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#102338}.title{font-size:28px;font-weight:bold}.small{font-size:14px}.label{font-size:17px}.box{fill:white;stroke:#315873;stroke-width:2}.wire{stroke:#11789a;stroke-width:3;fill:none}</style>
<text x="35" y="45" font-family="Arial,sans-serif" font-size="28" fill="#102338">ROBOSKIN | Separate sensor power and CAN FD harness</text>
<text x="35" y="78" font-family="Arial,sans-serif" font-size="14" fill="#102338">Engineering drawing: reference circuit only. Independent sensing circuit. Dimensions in mm; pin numbering is electrical, not a connector-view sketch.</text>
<rect x="35" y="110" width="355" height="155" rx="8" fill="white" stroke="#315873" stroke-width="2"/>
<text x="50" y="137" font-family="Arial,sans-serif" font-size="17" fill="#102338">Independent skin system</text>
<text x="50" y="164" font-family="Arial,sans-serif" font-size="14" fill="#102338">28 touch sites + two NTC points per patch</text>
<text x="50" y="186" font-family="Arial,sans-serif" font-size="14" fill="#102338">Local conversion and fault diagnostics</text>
<text x="50" y="208" font-family="Arial,sans-serif" font-size="14" fill="#102338">Up to eight controllers per bench region</text>
<text x="50" y="230" font-family="Arial,sans-serif" font-size="14" fill="#102338">Dedicated four-wire sensor trunk</text>
<rect x="440" y="110" width="420" height="155" rx="8" fill="white" stroke="#315873" stroke-width="2"/>
<text x="455" y="137" font-family="Arial,sans-serif" font-size="17" fill="#102338">Default: isolated bench supply</text>
<text x="455" y="164" font-family="Arial,sans-serif" font-size="14" fill="#102338">5.00 V, 1.5 A current limit per region</text>
<text x="455" y="186" font-family="Arial,sans-serif" font-size="14" fill="#102338">Region eFuse TPS259530: about 1 A latch-off</text>
<text x="455" y="208" font-family="Arial,sans-serif" font-size="14" fill="#102338">The input accepts regulated 5 V only</text>
<text x="455" y="230" font-family="Arial,sans-serif" font-size="14" fill="#102338">One supply -&gt; protected regional power trunk</text>
<rect x="930" y="110" width="520" height="155" rx="8" fill="white" stroke="#315873" stroke-width="2"/>
<text x="945" y="137" font-family="Arial,sans-serif" font-size="17" fill="#102338">Supply acceptance contract</text>
<text x="945" y="164" font-family="Arial,sans-serif" font-size="14" fill="#102338">Use an isolated, regulated bench source</text>
<text x="945" y="186" font-family="Arial,sans-serif" font-size="14" fill="#102338">4.75–5.25 V at regional input</text>
<text x="945" y="208" font-family="Arial,sans-serif" font-size="14" fill="#102338">Peak regional load allocation: 0.64 A</text>
<text x="945" y="230" font-family="Arial,sans-serif" font-size="14" fill="#102338">Current limit and ripple verified before use</text>
<rect x="35" y="315" width="355" height="135" rx="8" fill="white" stroke="#315873" stroke-width="2"/>
<text x="50" y="342" font-family="Arial,sans-serif" font-size="17" fill="#102338">Linux host / dedicated adapter</text>
<text x="50" y="369" font-family="Arial,sans-serif" font-size="14" fill="#102338">PEAK IPEH-004022 isolated USB-CAN FD</text>
<text x="50" y="391" font-family="Arial,sans-serif" font-size="14" fill="#102338">DB9: 7 H / 2 L / 3,6 skin GND</text>
<text x="50" y="413" font-family="Arial,sans-serif" font-size="14" fill="#102338">DB9 pin 1 optional supply DISABLED</text>
<rect x="440" y="315" width="420" height="135" rx="8" fill="white" stroke="#315873" stroke-width="2"/>
<text x="455" y="342" font-family="Arial,sans-serif" font-size="17" fill="#102338">Region controller / trunk entry</text>
<text x="455" y="369" font-family="Arial,sans-serif" font-size="14" fill="#102338">1 Mbit/s nominal; 2 Mbit/s data</text>
<text x="455" y="391" font-family="Arial,sans-serif" font-size="14" fill="#102338">Near end: 120 ohm H–L; adapter term OFF</text>
<text x="455" y="413" font-family="Arial,sans-serif" font-size="14" fill="#102338">Local fault LED + manual latch reset</text>
