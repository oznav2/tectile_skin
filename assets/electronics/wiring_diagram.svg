<text x="1170" y="715" font-family="Arial,sans-serif" font-size="17" fill="#102338">Far end: fixed 120 ohm H–L</text>
<text x="1170" y="738" font-family="Arial,sans-serif" font-size="14" fill="#102338">Not on removable Node 8</text>
<rect x="35" y="775" width="670" height="190" rx="8" fill="white" stroke="#315873" stroke-width="2"/>
<text x="50" y="802" font-family="Arial,sans-serif" font-size="17" fill="#102338">Mechanical routing and service</text>
<text x="50" y="829" font-family="Arial,sans-serif" font-size="14" fill="#102338">Continuous trunk survives removing a node. Trunk short can disable a region.</text>
<text x="50" y="851" font-family="Arial,sans-serif" font-size="14" fill="#102338">Use a cable rated for the actual joint bending/torsion; no film across hinge creases.</text>
<text x="50" y="873" font-family="Arial,sans-serif" font-size="14" fill="#102338">Clamp before each bend; default radius &gt;= larger of vendor limit and 10x diameter.</text>
<text x="50" y="895" font-family="Arial,sans-serif" font-size="14" fill="#102338">Power OFF before GH or sensor-tail insertion. No guaranteed first-mate ground.</text>
<text x="50" y="917" font-family="Arial,sans-serif" font-size="14" fill="#102338">Label and key every harness; verify each numbered endpoint before power.</text>
<rect x="755" y="775" width="695" height="190" rx="8" fill="white" stroke="#315873" stroke-width="2"/>
<text x="770" y="802" font-family="Arial,sans-serif" font-size="17" fill="#102338">Acceptance measurements</text>
<text x="770" y="829" font-family="Arial,sans-serif" font-size="14" fill="#102338">Unpowered H–L: about 60 ohm; verify polarity and every numbered endpoint.</text>
<text x="770" y="851" font-family="Arial,sans-serif" font-size="14" fill="#102338">Loaded distal LDO input &gt;=3.8 V; ground shift target &lt;=0.25 V.</text>
<text x="770" y="873" font-family="Arial,sans-serif" font-size="14" fill="#102338">Average eight-node load budget 0.24 A; peak allocation 0.64 A.</text>
<text x="770" y="895" font-family="Arial,sans-serif" font-size="14" fill="#102338">Log bus errors and stale sensors while flexing the actual installed harness.</text>
<text x="770" y="917" font-family="Arial,sans-serif" font-size="14" fill="#102338">Check isolated instrument grounds; scope/programmer must not bypass isolation.</text>
